version: 1
disable_existing_loggers: false

formatters:
  console:
    format: "%(asctime)s - %(levelname)s - %(message)s"
  access:
    class: uvicorn.logging.AccessFormatter
    format: '%(asctime)s %(levelname)s [%(client_addr)s] "%(request_line)s" %(status_code)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stdout
  access_console:
    class: logging.StreamHandler
    level: INFO
    formatter: access
    stream: ext://sys.stdout

loggers:
  uvicorn:
    handlers: [console]
    level: INFO
    propagate: false
  uvicorn.error:
    handlers: [console]
    level: INFO
    propagate: false
  uvicorn.access:
    handlers: [access_console]
    level: INFO
    propagate: false

root:
  level: INFO
  handlers: [console]